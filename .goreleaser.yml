version: 2

project_name: genv

builds:
  - id: genv
    main: .
    binary: genv
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: binaries
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: completions/*

checksum:
  name_template: checksums.txt

# ── Keyless signing via Sigstore/cosign ────────────────────────────────────────
# Signs the checksums file using the cosign keyless (OIDC) workflow.
# Requires: sigstore/cosign-installer step + id-token: write permission in the
# release workflow. Produces checksums.txt.sigstore.json alongside every release.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

# ── macOS Developer ID signing + notarization (anchore/quill) ─────────────────
# Signs and notarizes Darwin binaries on any OS (including ubuntu-latest CI).
# Enabled only when MACOS_SIGN_P12 is set so local snapshots still work without
# Apple credentials. See RELEASING.md for one-time cert / API key / secrets setup.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - genv
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# ── Homebrew tap ──────────────────────────────────────────────────────────────
# Publishes a cask to ks1686/homebrew-tap on every non-prerelease tag.
# Requires secret: HOMEBREW_TAP_GITHUB_TOKEN (fine-grained PAT with
# Contents: read+write on the homebrew-tap repo).
#
# Install after setup:
#   brew tap ks1686/tap
#   brew install --cask genv
homebrew_casks:
  - name: genv
    repository:
      owner: ks1686
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ks1686/genv"
    description: "Track, sync, and reproduce your software environment across Linux, macOS, Windows, and WSL2."
    license: MIT
    skip_upload: auto  # skips pre-releases automatically
    # Darwin release binaries are Developer ID signed and notarized. After a cask
    # upgrade the binary path under Caskroom changes; reload the updates
    # LaunchAgent so launchd picks up the new ProgramArguments path.
    hooks:
      post:
        install: |
          if OS.mac?
            plist = File.expand_path("~/Library/LaunchAgents/genv.updates.plist")
            if File.exist?(plist)
              system_command "#{staged_path}/genv", args: ["updates", "start"]
            end
          end

# ── Snap Store ────────────────────────────────────────────────────────────────
# Publishes a snap to the Snap Store on every non-prerelease tag.
# Requires secret: SNAPCRAFT_STORE_CREDENTIALS
#
# Install after setup:
#   snap install genv
snapcrafts:
  - name: genv
    summary: "Declarative package and environment manager."
    description: "genv is a command-line tool to track, sync, and reproduce your software environment across Linux, macOS, Windows, and WSL2. It helps you manage packages, environment variables, and shell configuration declaratively."
    license: MIT
    grade: stable
    confinement: strict
    channel_templates:
      - stable
    publish: true



# ── Scoop bucket ──────────────────────────────────────────────────────────────
# Publishes a manifest to ks1686/scoop-bucket on every non-prerelease tag
# Empty or unset SCOOP_BUCKET_GITHUB_TOKEN → skip upload so the
# rest of the release (GitHub, Homebrew, Snap) still succeeds.
# Requires secret: SCOOP_BUCKET_GITHUB_TOKEN (fine-grained PAT with
# Contents: read+write on the scoop-bucket repo).
#
# Manifests stay at the bucket root (do not set directory) so
# `scoop install genv` can find them.
#
# Install after setup:
#   scoop bucket add ks1686 https://github.com/ks1686/scoop-bucket
#   scoop install genv
#
# winget and Chocolatey publishers are GoReleaser Pro-only; do not declare
# them here or OSS goreleaser check / CI fails to parse the config.
scoops:
  - name: genv
    repository:
      owner: ks1686
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/ks1686/genv"
    description: "Track, sync, and reproduce your software environment across Linux, macOS, Windows, and WSL2."
    license: MIT
    skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_GITHUB_TOKEN" }}{{ if .Env.SCOOP_BUCKET_GITHUB_TOKEN }}auto{{ else }}true{{ end }}{{ else }}true{{ end }}'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
