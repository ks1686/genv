name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted (run 'make fmt'):"
            echo "$files"
            exit 1
          fi

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Coverage floor
        run: make cover-gate
        env:
          COVER_MIN: "80"

      - name: Cold-start bench gate
        run: make bench-gate
        env:
          # Shared GitHub runners are slower than local machines (~250ms observed
          # for BenchmarkDetect). Keep a regression gate with headroom for noise.
          BENCH_MAX_MS: "400"

      - name: govulncheck
        # v1.7.0+ requires Go 1.25; this module is still on go 1.24.3 and
        # setup-go sets GOTOOLCHAIN=local, so @latest fails to build.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -timeout 8m ./...
