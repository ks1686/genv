name: CI

on:
  push:
  pull_request:

jobs:
  # Build, vet, format and unit tests on every supported platform, plus the
  # coverage floor, cold-start bench gate and govulncheck. Defined in a
  # reusable workflow so the Release gate runs exactly these checks rather
  # than a hand-copied subset.
  test:
    uses: ./.github/workflows/test.yml

  # Linters that need no platform matrix. `make lint` is the same command the
  # Makefile runs locally, so a finding here is reproducible on a laptop; the
  # config in .golangci.yml pins the linter set, and the action version is
  # pinned to the same major/minor used during development.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --timeout=5m
