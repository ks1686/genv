name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = GoReleaser + AUR; aur-only = republish AUR for an existing GitHub release"
        type: choice
        options:
          - full
          - aur-only
        default: full
      version:
        description: "Semver without leading v (required for aur-only, e.g. 4.0.3)"
        required: false
        type: string
  push:
    tags:
      - "v*"

# No workflow-wide token scope; each job asks for exactly what it uses.
permissions: {}

jobs:
  # A tag push must not publish binaries that fail their own test suite.
  # v4.5.2 shipped with a red Windows job because nothing between the tag and
  # GoReleaser checked anything. This runs the same reusable all-platform
  # workflow CI uses, so release readiness is a fact rather than an assumption.
  preflight:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    name: Build and publish release
    needs: preflight
    # MACOS_* signing secrets live in the tag-only `release` environment.
    # Only run from a v* tag; aur-only dispatches skip this job (the aur job
    # below still runs for them).
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.mode == 'full')
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless cosign signing of checksums.txt

    steps:
      - name: Resolve checkout ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "aur-only" ]; then
            version="$INPUT_VERSION"
            version="${version#v}"
            if [ -z "$version" ]; then
              echo "aur-only requires the version input" >&2
              exit 1
            fi
            # Checkout the workflow branch (latest publish scripts), not the
            # release tag — AUR scripts only need the version string + GitHub
            # release assets, not the tagged tree.
            echo "ref=$GH_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GH_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - name: Resolve mode and version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            mode="full"
            version="${GITHUB_REF_NAME#v}"
          else
            mode="$INPUT_MODE"
            version="$INPUT_VERSION"
            version="${version#v}"
            if [ -z "$version" ]; then
              version="$(git describe --tags --abbrev=0)"
              version="${version#v}"
            fi
          fi
          if [ -z "$version" ]; then
            echo "could not resolve release version" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$mode version=$version"

      - name: Set up Go
        if: steps.meta.outputs.mode == 'full'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install cosign
        if: steps.meta.outputs.mode == 'full'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Run unit test suite
        if: steps.meta.outputs.mode == 'full'
        run: go test ./...

      - name: Run GoReleaser
        if: steps.meta.outputs.mode == 'full'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          # Notarization wait can exceed the default on first Apple submit.
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          # Developer ID Application (.p12 base64) + App Store Connect API key.
          # When MACOS_SIGN_P12 is unset, GoReleaser skips notarize.macos.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  # AUR SSH from ubuntu-latest currently gets "down due to maintenance" while
  # residential/macOS egress reaches a healthy IPv4 endpoint. Publish AUR from
  # macOS so v4.x repairs and releases can land.
  aur:
    name: Publish to AUR
    needs: release
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'aur-only'))
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
            version="${version#v}"
          fi
          if [ -z "$version" ]; then
            echo "could not resolve release version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.meta.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Publish to AUR (genv-bin, pre-compiled binary)
        if: steps.meta.outputs.skip == 'false'
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash .github/scripts/publish-aur.sh "$VERSION"

      - name: Publish to AUR (genv, builds from source)
        if: steps.meta.outputs.skip == 'false'
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash .github/scripts/publish-aur-src.sh "$VERSION"
